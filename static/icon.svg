<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
	<defs>
		<linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
			<stop offset="0%" stop-color="#34353a"/>
			<stop offset="100%" stop-color="#1c1d20"/>
		</linearGradient>
		<linearGradient id="keyGrad" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0%" stop-color="#fbfbfb"/>
			<stop offset="100%" stop-color="#cfd1d5"/>
		</linearGradient>
	</defs>

	<!-- Chassis -->
	<rect x="24" y="24" width="464" height="464" rx="88" fill="url(#bgGrad)" stroke="#4a4c52" stroke-width="8"/>

	<!-- 7-segment style display -->
	<rect x="84" y="80" width="344" height="120" rx="16" fill="#0b0b0c" stroke="#3a3b3f" stroke-width="5"/>
	<text x="256" y="172" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="92" font-weight="900" font-style="italic" fill="#ff3b30" text-anchor="middle" letter-spacing="6">S-1</text>

	<!-- Knobs with the S-1's coloured rings -->
	<circle cx="146" cy="268" r="34" fill="none" stroke="#f1f1ee" stroke-width="9"/>
	<circle cx="146" cy="268" r="25" fill="#141416"/>
	<line x1="146" y1="248" x2="146" y2="262" stroke="#f4f4f2" stroke-width="6" stroke-linecap="round"/>

	<circle cx="256" cy="268" r="34" fill="none" stroke="#4fb58f" stroke-width="9"/>
	<circle cx="256" cy="268" r="25" fill="#141416"/>
	<line x1="256" y1="248" x2="256" y2="262" stroke="#f4f4f2" stroke-width="6" stroke-linecap="round"/>

	<circle cx="366" cy="268" r="34" fill="none" stroke="#e0823d" stroke-width="9"/>
	<circle cx="366" cy="268" r="25" fill="#141416"/>
	<line x1="366" y1="248" x2="366" y2="262" stroke="#f4f4f2" stroke-width="6" stroke-linecap="round"/>

	<!-- Keyboard / step pads -->
	<rect x="84" y="336" width="58" height="96" rx="9" fill="url(#keyGrad)"/>
	<rect x="156" y="336" width="58" height="96" rx="9" fill="#f97316"/>
	<rect x="228" y="336" width="58" height="96" rx="9" fill="url(#keyGrad)"/>
	<rect x="300" y="336" width="58" height="96" rx="9" fill="url(#keyGrad)"/>
	<rect x="372" y="336" width="58" height="96" rx="9" fill="#f97316"/>
</svg>
